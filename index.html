<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>围棋对战平台</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,"Microsoft YaHei",sans-serif}
body{background:#1a1a2e;color:#e0e0e0;min-height:100vh}

/* 登录页 */

/* 聊天室 */
.chat-box{background:#16213e;border-radius:8px;margin-top:20px;overflow:hidden;display:flex;flex-direction:column;height:300px}
.chat-box h3{padding:12px 15px;background:#0f1623;color:#e8d5b7;font-size:15px;flex-shrink:0}
.chat-messages{flex:1;overflow-y:auto;padding:10px 15px;font-size:14px;line-height:1.6}
.chat-messages .chat-msg{margin-bottom:6px;word-break:break-word}
.chat-messages .chat-user{color:#c9a96e;font-weight:bold;margin-right:6px}
.chat-messages .chat-time{color:#555;font-size:11px;margin-right:6px}
.chat-messages .chat-text{color:#ddd}
.chat-input-row{display:flex;gap:8px;padding:10px 15px;background:#0f1623;flex-shrink:0}
.chat-input{flex:1;padding:8px 12px;border:1px solid #334;border-radius:6px;background:#16213e;color:#fff;font-size:14px}
.chat-input:focus{outline:none;border-color:#c9a96e}
/* 游戏页 */
#gamePage{display:none;flex-direction:column;align-items:center;padding:20px}
#gamePage.active{display:flex}
#gameHeader{display:flex;align-items:center;gap:15px;margin-bottom:10px;flex-wrap:wrap;justify-content:center}
#gameHeader .player{padding:8px 16px;border-radius:8px;background:#16213e;font-size:14px}
#gameHeader .player.active{background:#c9a96e;color:#1a1a2e;font-weight:bold}
#gameHeader .turn{font-size:16px;font-weight:bold;color:#e8d5b7}
#gameCanvas{background:#dcb35c;border-radius:4px;cursor:pointer;box-shadow:0 4px 20px rgba(0,0,0,.5)}
#controls{margin-top:12px;display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
#controls .btn{font-size:14px;padding:8px 18px}
.btn.pass{background:#95a5a6}
.btn.resign{background:#e74c3c;color:#fff}
.btn.newgame{background:#27ae60}
.btn.back{background:#7f8c8d}
#status{margin-top:10px;font-size:15px;color:#e8d5b7;min-height:24px;text-align:center}
#scoreBoard{display:flex;gap:25px;margin-top:8px;font-size:14px}
#scoreBoard b{color:#e8d5b7}
#audioNote{font-size:12px;color:#888;margin-top:8px;text-align:center}
.diff-box{margin-top:10px;text-align:center}
.diff-box .btn{font-size:13px;padding:8px 16px;min-width:80px}
</style>
</head>
<body>

<!-- 登录/注册 -->
<div id="loginPage" class="page active">
  <div class="login-box">
    <h2>围棋对战平台</h2>
    <div class="tab">

<!-- 大厅 -->
<div id="lobbyPage" class="page">
  <div class="lobby-header">
    <h2>围棋大厅</h2>
    <div class="user-info">
      玩家: <b id="lobbyUser"></b> | 胜 <b id="lobbyWins">0</b> 负 <b id="lobbyLosses">0</b>
      <button class="btn logout" onclick="logout()">退出</button>
    </div>
  </div>
  <div class="lobby-stats">
    <div class="stat-card"><div class="num" id="onlineCount">0</div><div class="label">在线人数</div></div>
    <div class="stat-card"><div class="num" id="waitingCount">0</div><div class="label">等待中房间</div></div>
    <div class="stat-card"><div class="num" id="playingCount">0</div><div class="label">对局中</div></div>
  </div>
  <div class="lobby-actions">
    <button class="btn create" onclick="createRoom()">创建房间</button>
    <button class="btn ai" onclick="showAIDiff()">人机对战</button>
    <button class="btn refresh" onclick="refreshLobby()">刷新列表</button>

  <div class="diff-box" id="aiDiffBox" style="display:none">
    <button class="btn" onclick="startAI('easy')">简单</button>

  <div class="room-list">

    <h3>聊天室</h3>
    <div id="chatMessages" class="chat-messages"></div>
    <div class="chat-input-row">
      <input type="text" id="chatInput" class="chat-input" placeholder="说点什么..." maxlength="200" onkeydown="if(event.key==='Enter')sendChat()">
      <button class="btn" onclick="sendChat()">发送</button>
    </div>
  </div>
</div>

<!-- 游戏 -->
<div id="gamePage" class="page">
  <div id="gameHeader">
    <span class="player" id="blackPlayer">黑棋</span>
    <span class="turn" id="turnText">黑棋落子</span>
    <span class="player" id="whitePlayer">白棋</span>
  </div>
  <canvas id="gameCanvas" width="640" height="640"></canvas>
  <div id="scoreBoard">
    <span>黑提子: <b id="blackCap">0</b></span>
    <span>白提子: <b id="whiteCap">0</b></span>
    <span>手数: <b id="moveCount">0</b></span>
  </div>
  <div id="controls">
    <button class="btn pass" onclick="doPass()">虚手</button>
    <button class="btn resign" onclick="doResign()">认输</button>
    <button class="btn newgame" onclick="newGame()">重新开始</button>
    <button class="btn back" onclick="leaveGame()">返回大厅</button>
  </div>
  <div id="status"></div>
</div>

<audio id="bgMusic" loop><source src="music.mp3" type="audio/mpeg"></audio>

<script>
// ==================== 配置 ====================
const SIZE=19, EMPTY=0, BLACK=1, WHITE=2;
const KV="/api/kv/";
const COLOR_NAMES={1:"黑棋",2:"白棋"};
const HEARTBEAT_INTERVAL=30000;
const ONLINE_TIMEOUT=60000;
const LOBBY_REFRESH_INTERVAL=25000;
const GAME_SYNC_INTERVAL=3000;

let currentUser="";
let gameMode=""; // online / ai
let aiLevel="", aiColor=WHITE, aiThinking=false;
let myColor=0, currentRoomId="";
let lobbyTimer=null, gameTimer=null, heartbeatTimer=null;
let canvas,ctx,cellSize,padding,stoneRadius,hoverPos=null;
let gameState=newBoard();
let gameOverAutoExit=false;

// ==================== kvdb.io 操作 ====================
async function kvGet(key){
  for(let i=0;i<4;i++){
    const r=await fetch(KV+key+"?t="+Date.now(),{cache:"no-store"});
    if(r.status===429){await new Promise(res=>setTimeout(res,3000*(i+1)));continue;}
    if(r.status===404)return null;
    if(!r.ok)throw new Error("读取失败:"+r.status);
    return await r.json();
  }
  throw new Error("读取失败:限流");
}
async function kvSet(key,val){
  for(let i=0;i<4;i++){
    const r=await fetch(KV+key+"?t="+Date.now(),{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(val)});
    if(r.status===429){await new Promise(res=>setTimeout(res,3000*(i+1)));continue;}
    if(!r.ok)throw new Error("写入失败:"+r.status);
    return;
  }
  throw new Error("写入失败:限流");
}
// 读-改-写重试（解决并发冲突）
async function kvUpdate(key,mutator,retries=5){
  for(let i=0;i<retries;i++){
    const data=await kvGet(key);
    const newData=mutator(data);
    try{
      await kvSet(key,newData);
      return newData;
    }catch(e){
      if(i===retries-1)throw e;
      await new Promise(r=>setTimeout(r,200));
    }
  }
}

// ==================== 密码哈希（纯JS实现，不依赖crypto.subtle） ====================
function hashPass(pwd){
  const s=pwd+"_go_platform_salt_2026";
  // 多轮混合哈希
  let h1=0x811c9dc5,h2=0xdeadbeef;
  for(let round=0;round<64;round++){
    for(let i=0;i<s.length;i++){
      const c=s.charCodeAt(i)+round;
      h1=Math.imul(h1^c,2654435761)>>>0;
      h2=Math.imul(h2^((c<<16)|(c>>16)),1597334677)>>>0;
      h1=(h1+h2)>>>0;
      h2=(h2^h1)>>>0;
    }
  }
  const hex=(n)=>n.toString(16).padStart(8,"0");
  return hex(h1)+hex(h2)+hex(h1^h2)+hex((h1*h2)>>>0);
}

// ==================== 用户系统 ====================
let authMode="login";
function switchTab(mode){
  authMode=mode;
  document.getElementById("tabLogin").classList.toggle("active",mode==="login");
  document.getElementById("tabRegister").classList.toggle("active",mode==="register");
  document.getElementById("authBtn").textContent=mode==="login"?"登录":"注册";
  document.getElementById("authErr").textContent="";
}

async function doAuth(){
  const err=document.getElementById("authErr");
  err.textContent="";
  const username=document.getElementById("usernameInput").value.trim();
  const password=document.getElementById("passwordInput").value;
  if(!username||!password){err.textContent="请输入用户名和密码";return;}
  if(username.length<2||username.length>20){err.textContent="用户名2-20个字符";return;}
  if(password.length<3){err.textContent="密码至少3位";return;}

  const btn=document.getElementById("authBtn");
  btn.disabled=true;btn.textContent="请稍候...";

  try{
    const users=await kvGet("go_users")||{};
    const hashed=hashPass(password);

    if(authMode==="register"){
      if(users[username]){err.textContent="用户名已存在";btn.disabled=false;btn.textContent="注册";return;}
      users[username]={pass:hashed,wins:0,losses:0};
      await kvSet("go_users",users);
    }else{
      if(!users[username]){err.textContent="用户不存在";btn.disabled=false;btn.textContent="登录";return;}
      if(users[username].pass!==hashed){err.textContent="密码错误";btn.disabled=false;btn.textContent="登录";return;}
    }

    currentUser=username;
    await kvUpdate("go_online",(data)=>{
      const o=data||{};
      o[username]=Date.now();
      return o;
    });
    enterLobby(users[username]);
  }catch(e){
    err.textContent="网络错误:"+e.message;
  }
  btn.disabled=false;
  btn.textContent=authMode==="login"?"登录":"注册";
}

async function heartbeat(){
  try{
    await kvUpdate("go_online",(data)=>{
      const o=data||{};
      const now=Date.now();
      for(const u in o){if(now-o[u]>ONLINE_TIMEOUT)delete o[u];}
      o[currentUser]=now;
      return o;
    });
  }catch(e){}
}

function enterLobby(userData){
  document.getElementById("loginPage").classList.remove("active");
  document.getElementById("lobbyPage").classList.add("active");
  document.getElementById("lobbyUser").textContent=currentUser;
  document.getElementById("lobbyWins").textContent=userData.wins||0;
  document.getElementById("lobbyLosses").textContent=userData.losses||0;
  refreshLobby();
  lobbyTimer=setInterval(refreshLobby,LOBBY_REFRESH_INTERVAL);
  heartbeatTimer=setInterval(heartbeat,HEARTBEAT_INTERVAL);
}

async function refreshLobby(){
  try{
    const [online,rooms,chat]=await Promise.all([
      kvGet("go_online"),kvGet("go_rooms_meta"),kvGet("go_chat")
    ]);
    const now=Date.now();
    // 在线人数
    const onlineUsers=Object.entries(online||{}).filter(([,t])=>now-t<ONLINE_TIMEOUT);
    document.getElementById("onlineCount").textContent=onlineUsers.length;
    // 房间列表
    const roomMeta=rooms||{};
    const roomIds=Object.keys(roomMeta);
    let waiting=0,playing=0;
    const list=document.getElementById("roomList");
    const items=[];
    const expiredRooms=[];
    for(const rid of roomIds){
      const rm=roomMeta[rid];
      // 超时判断：waiting超过30分钟、playing超过2小时、finished超过2小时
      const isExpired =
        (rm.status==="waiting" && now-rm.created>1800000) ||
        (rm.status==="playing" && now-rm.created>7200000) ||
        (rm.status==="finished" && now-rm.created>7200000);
      if(isExpired){expiredRooms.push(rid);continue;}
      if(rm.status==="waiting")waiting++;
      else if(rm.status==="playing")playing++;
      const canJoin=rm.status==="waiting"&&rm.black!==currentUser;
      const canWatch=rm.status==="playing";
      items.push(`<div class="room-item">
        <div class="room-info">
          <div class="room-name">${rm.black} 的房间</div>
          <div class="room-meta">${rm.status==="waiting"?"等待加入...":"对局中: "+rm.black+" vs "+(rm.white||"--")}</div>
        </div>
        <div>
          ${canJoin?`<button class="btn join" onclick="joinRoom('${rid}')">加入</button>`:""}
          ${canWatch?`<button class="btn watch" onclick="watchRoom('${rid}')">旁观</button>`:""}
          ${rm.status==="waiting"&&rm.black===currentUser?`<button class="btn back" onclick="cancelRoom('${rid}')">取消</button>`:""}
          ${rm.status==="finished"?`<span style="color:#888;font-size:13px">${rm.winner?rm.winner+"胜":"已结束"}</span>`:""}
        </div>
      </div>`);
    }
    // 清理超时房间（异步，不阻塞显示）
    if(expiredRooms.length>0){
      kvUpdate("go_rooms_meta",(data)=>{
        const m=data||{};
        for(const rid of expiredRooms){delete m[rid];}
        return m;
      }).catch(()=>{});
    }
    document.getElementById("waitingCount").textContent=waiting;
    document.getElementById("playingCount").textContent=playing;
    list.innerHTML=items.length?items.join(""):'<div class="no-rooms">暂无房间，点击「创建房间」开局</div>';
    // 聊天室
    renderChat(chat||[]);
  }catch(e){
    console.error("刷新大厅失败:",e);
  }
}

let lastChatCount=0;
function renderChat(msgs){
  const box=document.getElementById("chatMessages");
  if(!box)return;
  if(msgs.length!==lastChatCount){
    const atBottom=box.scrollHeight-box.scrollTop-box.clientHeight<30;
    box.innerHTML=msgs.slice(-50).map(m=>{
      const d=new Date(m.time);
      const hh=String(d.getHours()).padStart(2,"0"),mm=String(d.getMinutes()).padStart(2,"0");
      return `<div class="chat-msg"><span class="chat-time">${hh}:${mm}</span><span class="chat-user">${escHtml(m.user)}:</span><span class="chat-text">${escHtml(m.msg)}</span></div>`;
    }).join("");
    if(atBottom||msgs.length>lastChatCount)box.scrollTop=box.scrollHeight;
    lastChatCount=msgs.length;
  }
}
function escHtml(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}

async function sendChat(){
  const input=document.getElementById("chatInput");
  const msg=input.value.trim();
  if(!msg||!currentUser)return;
  input.value="";
  try{
    await kvUpdate("go_chat",(data)=>{
      const arr=Array.isArray(data)?data:[];
      arr.push({user:currentUser,msg:msg.slice(0,200),time:Date.now()});
      return arr.slice(-50);
    });
    refreshLobby();
  }catch(e){
    input.value=msg;
    alert("发送失败:"+e.message);
  }
}

async function createRoom(){
  try{
    const rid="r"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
    const state=newBoard();
    const roomMeta={
      id:rid,black:currentUser,white:null,status:"waiting",
      created:Date.now(),winner:null
    };
    await kvSet("go_room_"+rid,state);
    await kvUpdate("go_rooms_meta",(data)=>{
      const m=data||{};
      m[rid]=roomMeta;
      return m;
    });
    currentRoomId=rid;myColor=BLACK;gameMode="online";
    enterGame();
  }catch(e){alert("创建房间失败:"+e.message);}
}

async function joinRoom(rid){
  try{
    const result=await kvUpdate("go_rooms_meta",(data)=>{
      const m=data||{};
      if(!m[rid]||m[rid].status!=="waiting"||m[rid].white)return m;
      m[rid].white=currentUser;
      m[rid].status="playing";
      return m;
    });
    if(result[rid].white!==currentUser){alert("房间已被加入");return;}
    currentRoomId=rid;myColor=WHITE;gameMode="online";
    enterGame();
  }catch(e){alert("加入房间失败:"+e.message);}
}

async function watchRoom(rid){
  currentRoomId=rid;myColor=0;gameMode="online";
  const meta=await kvGet("go_rooms_meta");
  if(meta[rid]){
    // 旁观者不执子
  }
  enterGame();
}

async function cancelRoom(rid){
  try{
    await kvUpdate("go_rooms_meta",(data)=>{
      const m=data||{};
      delete m[rid];
      return m;
    });
    refreshLobby();
  }catch(e){}
}

async function logout(){
  try{
    await kvUpdate("go_online",(data)=>{
      const o=data||{};
      delete o[currentUser];
      return o;
    });
  }catch(e){}
  currentUser="";
  clearInterval(lobbyTimer);clearInterval(heartbeatTimer);
  document.getElementById("lobbyPage").classList.remove("active");
  document.getElementById("loginPage").classList.add("active");
  document.getElementById("usernameInput").value="";
  document.getElementById("passwordInput").value="";
}

// ==================== 围棋逻辑 ====================
function newBoard(){
  return{
    board:Array.from({length:SIZE},()=>Array(SIZE).fill(EMPTY)),
    current:BLACK,captures:{black:0,white:0},ko:null,lastMove:null,
    passCount:0,gameOver:false,score:null,moveCount:0
  };
}
function cloneBoard(b){return b.map(r=>r.slice());}
function getGroup(board,x,y){
  const color=board[y][x];
  if(color===EMPTY)return{stones:[],liberties:new Set()};
  const stones=[],liberties=new Set();
  const vis=Array.from({length:SIZE},()=>Array(SIZE).fill(false));
  const stack=[[x,y]];vis[y][x]=true;
  while(stack.length){
    const[cx,cy]=stack.pop();stones.push([cx,cy]);
    for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){
      const nx=cx+dx,ny=cy+dy;
      if(nx<0||nx>=SIZE||ny<0||ny>=SIZE)continue;
      if(vis[ny][nx])continue;
      if(board[ny][nx]===EMPTY)liberties.add(nx+","+ny);
      else if(board[ny][nx]===color){vis[ny][nx]=true;stack.push([nx,ny]);}
    }
  }
  return{stones,liberties};
}
function isValidMove(state,x,y,color){
  if(state.gameOver||x<0||x>=SIZE||y<0||y>=SIZE)return false;
  if(state.board[y][x]!==EMPTY)return false;
  if(state.ko&&state.ko.x===x&&state.ko.y===y)return false;
  const board=cloneBoard(state.board);board[y][x]=color;
  const opp=color===BLACK?WHITE:BLACK;let captured=0;
  for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){
    const nx=x+dx,ny=y+dy;
    if(nx>=0&&nx<SIZE&&ny>=0&&ny<SIZE&&board[ny][nx]===opp){
      const g=getGroup(board,nx,ny);
      if(g.liberties.size===0){captured+=g.stones.length;for(const[sx,sy]of g.stones)board[sy][sx]=EMPTY;}
    }
  }
  const sg=getGroup(board,x,y);
  if(sg.liberties.size===0)return false;
  return true;
}
function makeMove(state,x,y,color){
  if(!isValidMove(state,x,y,color))return null;
  const ns=JSON.parse(JSON.stringify(state));
  ns.board[y][x]=color;
  const opp=color===BLACK?WHITE:BLACK;let captured=0,capStones=[];
  for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){
    const nx=x+dx,ny=y+dy;
    if(nx>=0&&nx<SIZE&&ny>=0&&ny<SIZE&&ns.board[ny][nx]===opp){
      const g=getGroup(ns.board,nx,ny);
      if(g.liberties.size===0){captured+=g.stones.length;for(const[sx,sy]of g.stones){ns.board[sy][sx]=EMPTY;capStones.push([sx,sy]);}}
    }
  }
  if(color===BLACK)ns.captures.black+=captured;else ns.captures.white+=captured;
  ns.ko=null;
  if(captured===1&&capStones.length===1){
    const sg=getGroup(ns.board,x,y);
    if(sg.stones.length===1&&sg.liberties.size===1)ns.ko={x:capStones[0][0],y:capStones[0][1]};
  }
  ns.lastMove={x,y,color};ns.passCount=0;ns.moveCount++;ns.current=opp;
  ns.gameOver=false;ns.score=null;
  return ns;
}
function doPass(state,color){
  if(state.gameOver||state.current!==color)return null;
  const ns=JSON.parse(JSON.stringify(state));
  ns.passCount++;ns.lastMove=null;ns.ko=null;
  ns.current=color===BLACK?WHITE:BLACK;
  if(ns.passCount>=2){ns.gameOver=true;ns.score=calcScore(ns.board);}
  return ns;
}
function calcScore(board){
  const terr={black:0,white:0},stones={black:0,white:0};
  const vis=Array.from({length:SIZE},()=>Array(SIZE).fill(false));
  for(let y=0;y<SIZE;y++)for(let x=0;x<SIZE;x++){
    if(board[y][x]===BLACK)stones.black++;
    else if(board[y][x]===WHITE)stones.white++;
    else if(!vis[y][x]){
      const region=[],borders=new Set(),stack=[[x,y]];vis[y][x]=true;
      while(stack.length){
        const[cx,cy]=stack.pop();region.push([cx,cy]);
        for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){
          const nx=cx+dx,ny=cy+dy;
          if(nx<0||nx>=SIZE||ny<0||ny>=SIZE)continue;
          if(vis[ny][nx])continue;
          if(board[ny][nx]===EMPTY){vis[ny][nx]=true;stack.push([nx,ny]);}
          else borders.add(board[ny][nx]);
        }
      }
      if(borders.size===1){const c=[...borders][0];if(c===BLACK)terr.black+=region.length;else terr.white+=region.length;}
    }
  }
  const bt=stones.black+terr.black,wt=stones.white+terr.white+3.75;
  return{black:bt,white:wt,winner:bt>wt?BLACK:WHITE,stones,territory:terr};
}
function getValidMoves(state,color){
  const moves=[];
  for(let y=0;y<SIZE;y++)for(let x=0;x<SIZE;x++)if(isValidMove(state,x,y,color))moves.push([x,y]);
  return moves;
}
function isOwnEye(board,x,y,color){
  const opp=color===BLACK?WHITE:BLACK;
  for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){
    const nx=x+dx,ny=y+dy;
    if(nx<0||nx>=SIZE||ny<0||ny>=SIZE)continue;
    if(board[ny][nx]!==color)return false;
  }
  let oc=0;
  for(const[dx,dy]of[[1,1],[1,-1],[-1,1],[-1,-1]]){
    const nx=x+dx,ny=y+dy;
    if(nx<0||nx>=SIZE||ny<0||ny>=SIZE)continue;
    if(board[ny][nx]===opp)oc++;
  }
  return oc<2;
}

// ==================== AI ====================
function aiEasy(state,color){
  const moves=getValidMoves(state,color).filter(([x,y])=>!isOwnEye(state.board,x,y,color));
  const pool=moves.length?moves:getValidMoves(state,color);
  return pool[Math.floor(Math.random()*pool.length)];
}
function aiMedium(state,color){
  const moves=getValidMoves(state,color);let best=null,bs=-Infinity;
  const opp=color===BLACK?WHITE:BLACK;
  for(const[x,y]of moves){
    if(isOwnEye(state.board,x,y,color))continue;
    let s=Math.random()*5;
    const ns=makeMove(state,x,y,color);if(!ns)continue;
    const cd=color===BLACK?ns.captures.black-state.captures.black:ns.captures.white-state.captures.white;
    s+=cd*100;
    let near=0;
    for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++){const nx=x+dx,ny=y+dy;if(nx>=0&&nx<SIZE&&ny>=0&&ny<SIZE&&ns.board[ny][nx]!==EMPTY)near++;}
    s+=near*2;
    const g=getGroup(ns.board,x,y);
    if(g.liberties.size<=1)s-=50;else if(g.liberties.size===2)s-=5;
    for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){
      const nx=x+dx,ny=y+dy;
      if(nx>=0&&nx<SIZE&&ny>=0&&ny<SIZE&&ns.board[ny][nx]===opp){
        const og=getGroup(ns.board,nx,ny);
        if(og.liberties.size<=1)s+=80;else if(og.liberties.size===2)s+=15;
      }
    }
    if(state.moveCount<20){const d=Math.min(x,y,SIZE-1-x,SIZE-1-y);if(d>=2&&d<=4)s+=8;}
    if(s>bs){bs=s;best=[x,y];}
  }
  return best;
}
function distNearest(board,x,y){
  let m=SIZE;
  for(let dy=-3;dy<=3;dy++)for(let dx=-3;dx<=3;dx++){
    if(!dx&&!dy)continue;
    const nx=x+dx,ny=y+dy;
    if(nx>=0&&nx<SIZE&&ny>=0&&ny<SIZE&&board[ny][nx]!==EMPTY){const d=Math.abs(dx)+Math.abs(dy);if(d<m)m=d;}
  }
  return m;
}
// MCTS
function mctsSelect(node){
  let best=null,bv=-Infinity;
  for(const c of node.children){
    if(c.visits===0)return c;
    const u=c.wins/c.visits+1.4*Math.sqrt(Math.log(node.visits)/c.visits);
    if(u>bv){bv=u;best=c;}
  }
  return best;
}
function mctsExpand(node){
  if(node.untried===null){
    node.untried=getValidMoves(node.state,node.state.current).filter(([x,y])=>!isOwnEye(node.state.board,x,y,node.state.current));
    if(node.state.moveCount>0){
      node.untried.sort((a,b)=>distNearest(node.state.board,a[0],a[1])-distNearest(node.state.board,b[0],b[1]));
      if(node.untried.length>40)node.untried=node.untried.slice(0,40);
    }
  }
  if(!node.untried.length)return null;
  const idx=Math.floor(Math.random()*Math.min(node.untried.length,10));
  const mv=node.untried.splice(idx,1)[0];
  const ns=makeMove(node.state,mv[0],mv[1],node.state.current);
  if(!ns)return null;
  const ch={state:ns,parent:node,move:mv,children:[],wins:0,visits:0,untried:null};
  node.children.push(ch);
  return ch;
}
function mctsSimulate(state,aiC){
  let s=JSON.parse(JSON.stringify(state)),moves=0;
  while(!s.gameOver&&moves<80){
    let v=getValidMoves(s,s.current).filter(([x,y])=>!isOwnEye(s.board,x,y,s.current));
    if(!v.length||Math.random()<0.05){s=doPass(s,s.current);if(!s)break;}
    else{
      let pool=v;
      if(s.moveCount>0){const n=v.filter(([x,y])=>distNearest(s.board,x,y)<=2);if(n.length&&Math.random()<0.7)pool=n;}
      const mv=pool[Math.floor(Math.random()*pool.length)];
      const ns=makeMove(s,mv[0],mv[1],s.current);
      if(ns)s=ns;else{s=doPass(s,s.current);if(!s)break;}
    }
    moves++;
  }
  return calcScore(s.board).winner===aiC?1:0;
}
function mctsBackprop(node,win){
  let n=node;
  while(n){n.visits++;n.wins+=win;n=n.parent;}
}
async function aiHard(state,color,prog){
  const root={state,parent:null,move:null,children:[],wins:0,visits:0,untried:null};
  const total=3000,chunk=50;
  for(let done=0;done<total;done+=chunk){
    for(let i=0;i<chunk;i++){
      let node=root;
      while(node.untried===null||!node.untried.length){
        if(!node.children.length)break;
        node=mctsSelect(node);if(!node)break;
      }
      if(node&&node.untried===null){
        node.untried=getValidMoves(node.state,node.state.current).filter(([x,y])=>!isOwnEye(node.state.board,x,y,node.state.current));
      }
      if(node&&node.untried&&node.untried.length&&!node.state.gameOver){
        const ex=mctsExpand(node);if(ex)node=ex;
      }
      mctsBackprop(node,mctsSimulate(node.state,color));
    }
    prog(Math.min(done+chunk,total),total);
    await new Promise(r=>setTimeout(r,0));
  }
  let best=null,bv=-1;
  for(const c of root.children)if(c.visits>bv){bv=c.visits;best=c;}
  return best?best.move:null;
}

// ==================== 渲染 ====================
function initCanvas(){
  canvas=document.getElementById("gameCanvas");
  ctx=canvas.getContext("2d");
  const sz=Math.min(640,window.innerWidth-40);
  canvas.width=sz;canvas.height=sz;
  padding=sz/(SIZE+1);
  cellSize=(sz-padding*2)/(SIZE-1);
  stoneRadius=cellSize*0.46;
  canvas.onclick=onCanvasClick;
  canvas.onmousemove=onCanvasMove;
  canvas.onmouseleave=()=>{hoverPos=null;draw();};
}
function toPix(x,y){return{px:padding+x*cellSize,py:padding+y*cellSize};}
function toBoard(px,py){
  const r=canvas.getBoundingClientRect();
  return{x:Math.round((px*(canvas.width/r.width)-padding)/cellSize),y:Math.round((py*(canvas.height/r.height)-padding)/cellSize)};
}
function draw(){
  if(!ctx)return;
  const w=canvas.width;
  ctx.fillStyle="#dcb35c";ctx.fillRect(0,0,w,w);
  ctx.strokeStyle="#3a2a10";ctx.lineWidth=1;
  for(let i=0;i<SIZE;i++){
    const p=padding+i*cellSize;
    ctx.beginPath();ctx.moveTo(padding,p);ctx.lineTo(w-padding,p);ctx.stroke();
    ctx.beginPath();ctx.moveTo(p,padding);ctx.lineTo(p,w-padding);ctx.stroke();
  }
  const stars=[3,9,15];ctx.fillStyle="#3a2a10";
  for(const sx of stars)for(const sy of stars){const{px,py}=toPix(sx,sy);ctx.beginPath();ctx.arc(px,py,3.5,0,Math.PI*2);ctx.fill();}
  for(let y=0;y<SIZE;y++)for(let x=0;x<SIZE;x++)if(gameState.board[y][x]!==EMPTY)drawStone(x,y,gameState.board[y][x]);
  if(gameState.lastMove){
    const{px,py}=toPix(gameState.lastMove.x,gameState.lastMove.y);
    ctx.strokeStyle=gameState.lastMove.color===BLACK?"#fff":"#000";ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(px,py,stoneRadius*0.35,0,Math.PI*2);ctx.stroke();
  }
  if(hoverPos&&!gameState.gameOver&&canPlay()){
    const{x,y}=hoverPos;
    if(x>=0&&x<SIZE&&y>=0&&y<SIZE&&gameState.board[y][x]===EMPTY&&isValidMove(gameState,x,y,myColor||gameState.current)){
      const{px,py}=toPix(x,y);
      const c=myColor||gameState.current;
      ctx.fillStyle=c===BLACK?"rgba(0,0,0,0.4)":"rgba(255,255,255,0.5)";
      ctx.beginPath();ctx.arc(px,py,stoneRadius,0,Math.PI*2);ctx.fill();
    }
  }
  ctx.fillStyle="#5a4520";ctx.font=Math.max(9,cellSize*0.3)+"px system-ui";
  ctx.textAlign="center";ctx.textBaseline="middle";
  const L="ABCDEFGHJKLMNOPQRST";
  for(let i=0;i<SIZE;i++){
    const p=padding+i*cellSize;
    ctx.fillText(L[i],p,padding*0.45);ctx.fillText(L[i],p,w-padding*0.45);
    ctx.fillText(SIZE-i,padding*0.45,p);ctx.fillText(SIZE-i,w-padding*0.45,p);
  }
}
function drawStone(x,y,color){
  const{px,py}=toPix(x,y);
  const g=ctx.createRadialGradient(px-stoneRadius*0.3,py-stoneRadius*0.3,stoneRadius*0.1,px,py,stoneRadius);
  if(color===BLACK){g.addColorStop(0,"#555");g.addColorStop(1,"#000");}
  else{g.addColorStop(0,"#fff");g.addColorStop(1,"#c8c8c8");}
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(px,py,stoneRadius,0,Math.PI*2);ctx.fill();
}

// ==================== 游戏交互 ====================
function canPlay(){
  if(gameMode==="ai")return gameState.current===myColor&&!aiThinking;
  if(myColor===0)return false; // 旁观者
  return gameState.current===myColor;
}
function onCanvasMove(e){
  const r=canvas.getBoundingClientRect();
  hoverPos=toBoard(e.clientX-r.left,e.clientY-r.top);
  draw();
}
function onCanvasClick(e){
  if(gameState.gameOver||aiThinking||!canPlay())return;
  const r=canvas.getBoundingClientRect();
  const{x,y}=toBoard(e.clientX-r.left,e.clientY-r.top);
  if(x<0||x>=SIZE||y<0||y>=SIZE)return;
  if(!isValidMove(gameState,x,y,myColor))return;
  const ns=makeMove(gameState,x,y,myColor);
  if(!ns)return;
  gameState=ns;draw();updateUI();
  if(gameMode==="online"){
    kvSet("go_room_"+currentRoomId,gameState).catch(err=>setStatus("同步失败:"+err.message));
  }else{
    maybeAITurn();
  }
}
async function maybeAITurn(){
  if(gameState.gameOver||gameState.current!==aiColor)return;
  aiThinking=true;setStatus("AI思考中...");
  let move;
  if(aiLevel==="easy"){await new Promise(r=>setTimeout(r,300));move=aiEasy(gameState,aiColor);}
  else if(aiLevel==="medium"){await new Promise(r=>setTimeout(r,300));move=aiMedium(gameState,aiColor);}
  else{move=await aiHard(gameState,aiColor,(d,t)=>setStatus("AI思考中..."+Math.round(d/t*100)+"%"));}
  aiThinking=false;
  if(move){const ns=makeMove(gameState,move[0],move[1],aiColor);if(ns)gameState=ns;}
  else{const ns=doPass(gameState,aiColor);if(ns)gameState=ns;}
  draw();updateUI();
  if(gameState.gameOver)showGameOver();
}
function doPass(){
  if(gameState.gameOver||aiThinking||!canPlay())return;
  const ns=doPass(gameState,myColor);if(!ns)return;
  gameState=ns;draw();updateUI();
  if(gameMode==="online")kvSet("go_room_"+currentRoomId,gameState).catch(e=>setStatus("同步失败:"+e.message));
  else if(!gameState.gameOver)maybeAITurn();
  if(gameState.gameOver)showGameOver();
}
async function doResign(){
  if(gameState.gameOver||aiThinking||!canPlay())return;
  if(!confirm("确定认输吗？"))return;
  gameState.gameOver=true;
  const winner=myColor===BLACK?WHITE:BLACK;
  gameState.score={winner,black:0,white:0,resigned:true};
  draw();updateUI();
  if(gameMode==="online"){
    try{await kvSet("go_room_"+currentRoomId,gameState);}catch(e){}
  }
  showGameOver();
}
async function showGameOver(){
  if(gameOverAutoExit)return;
  gameOverAutoExit=true;
  const s=gameState.score;
  let winnerName;
  if(gameMode==="ai"){
    winnerName=s.winner===BLACK?"你":"AI";
  }else{
    const names=await getRoomPlayerNames();
    winnerName=s.winner===BLACK?names.black:names.white;
  }
  if(s.resigned)setStatus("《"+winnerName+" 胜利》（对方认输）");
  else setStatus("终局！黑"+s.black.toFixed(1)+"目 vs 白"+s.white.toFixed(1)+"目，《"+winnerName+" 胜利》");
  if(gameMode==="online"){
    await kvUpdate("go_rooms_meta",(data)=>{
      const m=data||{};
      if(m[currentRoomId]){m[currentRoomId].status="finished";m[currentRoomId].winner=winnerName;}
      return m;
    });
    if(myColor===s.winner)await updateRecord(myColor,true);
    else await updateRecord(myColor,false);
  }
  if(gameMode==="ai"&&aiLevel==="hard")stopMusic();
  setTimeout(async()=>{
    if(gameMode==="online")await deleteOnlineRoom();
    leaveGame();
  },3000);
}
async function updateRecord(color,win){
  try{
    await kvUpdate("go_users",(data)=>{
      const u=data||{};
      if(u[currentUser]){
        if(win)u[currentUser].wins=(u[currentUser].wins||0)+1;
        else u[currentUser].losses=(u[currentUser].losses||0)+1;
      }
      return u;
    });
  }catch(e){}
}
function updateUI(){
  document.getElementById("blackCap").textContent=gameState.captures.black;
  document.getElementById("whiteCap").textContent=gameState.captures.white;
  document.getElementById("moveCount").textContent=gameState.moveCount;
  const be=document.getElementById("blackPlayer"),we=document.getElementById("whitePlayer");
  be.classList.toggle("active",gameState.current===BLACK&&!gameState.gameOver);
  we.classList.toggle("active",gameState.current===WHITE&&!gameState.gameOver);
  if(gameMode==="online"&&currentRoomId){
    kvGet("go_rooms_meta").then(meta=>{
      const rm=meta[currentRoomId];
      if(rm){
        be.textContent="黑: "+(rm.black||"--");
        we.textContent="白: "+(rm.white||"等待中...");
      }
    });
  }else if(gameMode==="ai"){
    be.textContent="黑: 你";we.textContent="白: AI("+aiLevel+")";
  }
  if(!gameState.gameOver&&!aiThinking)setStatus(COLOR_NAMES[gameState.current]+"落子");
}
function setStatus(m){document.getElementById("status").textContent=m;}

// ==================== 游戏同步 ====================
function startGameSync(){
  if(gameTimer)clearInterval(gameTimer);
  gameTimer=setInterval(async()=>{
    if(gameMode!=="online"||aiThinking)return;
    try{
      const remote=await kvGet("go_room_"+currentRoomId);
      if(remote&&(remote.moveCount!==gameState.moveCount||remote.gameOver!==gameState.gameOver)){
        gameState=remote;draw();updateUI();
        if(gameState.gameOver)showGameOver();
      }
    }catch(e){}
  },GAME_SYNC_INTERVAL);
}

// ==================== 页面流程 ====================
function showAIDiff(){
  const box=document.getElementById("aiDiffBox");
  box.style.display=box.style.display==="none"?"block":"none";
}
function startAI(level){
  gameMode="ai";aiLevel=level;aiColor=WHITE;myColor=BLACK;
  document.getElementById("lobbyPage").classList.remove("active");
  document.getElementById("gamePage").classList.add("active");
  if(!canvas)initCanvas();
  gameState=newBoard();draw();updateUI();
  setStatus("人机对战（"+level+"），你执黑");
  if(level==="hard")playMusic();
}
function enterGame(){
  if(lobbyTimer){clearInterval(lobbyTimer);lobbyTimer=null;}
  document.getElementById("lobbyPage").classList.remove("active");
  document.getElementById("gamePage").classList.add("active");
  if(!canvas)initCanvas();
  if(gameMode==="online"){
    kvGet("go_room_"+currentRoomId).then(s=>{
      if(s){gameState=s;draw();updateUI();startGameSync();}
    });
  }
}
function newGame(){
  if(!confirm("确定重新开始吗？"))return;
  if(gameMode==="online"){
    gameState=newBoard();
    kvSet("go_room_"+currentRoomId,gameState);
    kvUpdate("go_rooms_meta",(data)=>{
      const m=data||{};
      if(m[currentRoomId]){m[currentRoomId].status="playing";m[currentRoomId].winner=null;}
      return m;
    });
  }else{
    gameState=newBoard();
    if(aiLevel==="hard")playMusic();
  }
  aiThinking=false;draw();updateUI();setStatus("新对局开始");
}
async function deleteOnlineRoom(){
  if(gameMode!=="online"||!currentRoomId)return;
  try{
    await kvUpdate("go_rooms_meta",(data)=>{
      const m=data||{};
      delete m[currentRoomId];
      return m;
    });
  }catch(e){}
}
async function getRoomPlayerNames(){
  if(gameMode!=="online"||!currentRoomId)return {black:"你",white:"AI"};
  try{
    const meta=await kvGet("go_rooms_meta");
    const rm=meta&&meta[currentRoomId];
    if(rm)return {black:rm.black||"黑棋",white:rm.white||"白棋"};
  }catch(e){}
  return {black:"黑棋",white:"白棋"};
}
async function leaveGame(){
  if(gameTimer){clearInterval(gameTimer);gameTimer=null;}
  stopMusic();
  if(gameMode==="online"&&!gameState.gameOver&&currentRoomId&&myColor!==0){
    const winner=myColor===BLACK?WHITE:BLACK;
    gameState.gameOver=true;
    gameState.score={winner,black:0,white:0,resigned:true};
    try{
      await kvSet("go_room_"+currentRoomId,gameState);
      await updateRecord(myColor,false);
    }catch(e){}
    await deleteOnlineRoom();
  }else if(gameMode==="online"&&gameState.gameOver&&currentRoomId){
    await deleteOnlineRoom();
  }
  gameMode="";currentRoomId="";myColor=0;gameOverAutoExit=false;
  document.getElementById("gamePage").classList.remove("active");
  document.getElementById("lobbyPage").classList.add("active");
  document.getElementById("aiDiffBox").style.display="none";
  refreshLobby();
  if(!lobbyTimer)lobbyTimer=setInterval(refreshLobby,LOBBY_REFRESH_INTERVAL);
}

// ==================== 音乐 ====================
function playMusic(){
  const a=document.getElementById("bgMusic");a.volume=0.5;
  a.play().catch(()=>setStatus("未找到music.mp3，跳过音乐"));
}
function stopMusic(){const a=document.getElementById("bgMusic");a.pause();a.currentTime=0;}

// ==================== 页面可见性：隐藏时暂停轮询 ====================
document.addEventListener("visibilitychange",()=>{
  if(document.hidden){
    if(lobbyTimer){clearInterval(lobbyTimer);lobbyTimer=null;}
    if(gameTimer){clearInterval(gameTimer);gameTimer=null;}
    if(heartbeatTimer){clearInterval(heartbeatTimer);heartbeatTimer=null;}
  }else{
    if(currentUser){
      heartbeat();
      heartbeatTimer=setInterval(heartbeat,HEARTBEAT_INTERVAL);
      if(document.getElementById("lobbyPage").classList.contains("active")){
        refreshLobby();
        lobbyTimer=setInterval(refreshLobby,LOBBY_REFRESH_INTERVAL);
      }
      if(gameMode==="online"&&document.getElementById("gamePage").classList.contains("active")){
        startGameSync();
      }
    }
  }
});
</script>
</body>
</html>
